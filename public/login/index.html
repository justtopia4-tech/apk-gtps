<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SuperGT — Login Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #090a0f;
      --surface: #10121a;
      --surface2: #181b26;
      --surface3: #222636;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.6);
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-dim: rgba(99, 102, 241, 0.15);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.12);
      --red: #f43f5e;
      --red-dim: rgba(244, 63, 94, 0.12);
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Glows */
    body::before {
      content: '';
      position: fixed;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 70%);
      top: -160px;
      right: -160px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      bottom: -160px;
      left: -160px;
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px 36px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(99, 102, 241, 0.15);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      background: var(--primary-dim);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }

    .brand-icon svg {
      width: 34px;
      height: 34px;
      color: var(--primary-light);
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      padding: 14px 44px 14px 42px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrap input:focus {
      border-color: var(--border-focus);
      background: var(--surface3);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    .btn-toggle-pin {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s;
    }

    .btn-toggle-pin:hover {
      color: #fff;
    }

    .error-box {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--red-dim);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fda4af;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.55);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="title">SuperGT Portal</h1>
      <p class="subtitle">Masukkan PIN Keamanan untuk mengakses dan mengedit konfigurasi panel GTPS.</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-1.5 1.5L14 9m-1.5 1.5L9 14m-1.5 1.5L4 19l-2 2"></path>
            <circle cx="7.5" cy="7.5" r="3.5"></circle>
          </svg>
          <input 
            type="password" 
            id="pinInput" 
            placeholder="Masukkan PIN Akses..." 
            autocomplete="off" 
            autofocus 
            required 
          />
          <button type="button" class="btn-toggle-pin" onclick="togglePin()" title="Lihat/Sembunyikan PIN">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div class="error-box" id="errorBox">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="errorMsg">PIN salah! Akses ditolak.</span>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <span>Masuk ke Panel</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <div class="footer-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        Akses diamankan untuk Administrator
      </div>
    </div>
  </div>

  <script>
    const REQUIRED_PIN = "NOPYSOURCE#1000";
    const AUTH_KEY = "supergt_auth_pin";

    // Pastikan session lama bersih saat mendarat di halaman login
    sessionStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(AUTH_KEY);

    const pinInput = document.getElementById('pinInput');
    const errorBox = document.getElementById('errorBox');
    const errorMsg = document.getElementById('errorMsg');
    const btnSubmit = document.getElementById('btnSubmit');

    window.addEventListener('DOMContentLoaded', () => {
      if (pinInput) {
        pinInput.value = '';
        setTimeout(() => pinInput.focus(), 100);
      }
    });

    function togglePin() {
      const eyeIcon = document.getElementById('eyeIcon');
      if (pinInput.type === 'password') {
        pinInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        pinInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const entered = (pinInput.value || '').trim();
      errorBox.style.display = 'none';

      if (!entered) {
        showError('Silakan ketik PIN terlebih dahulu.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Memverifikasi...</span>';

      try {
        let verified = (entered === REQUIRED_PIN);
        try {
          const res = await fetch('/api/verify_pin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-panel-pin': entered },
            body: JSON.stringify({ pin: entered })
          });
          if (res.ok) verified = true;
          else if (res.status === 401) verified = false;
        } catch (apiErr) {
          verified = (entered === REQUIRED_PIN);
        }

        if (verified) {
          sessionStorage.setItem(AUTH_KEY, entered);
          btnSubmit.innerHTML = '<span>Berhasil! Mengalihkan...</span>';
          window.location.replace('/panel');
        } else {
          showError('PIN salah! Akses ditolak.');
          pinInput.select();
        }
      } finally {
        if (pinInput.value !== REQUIRED_PIN) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Masuk ke Panel</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
        }
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorBox.style.display = 'flex';
      errorBox.style.animation = 'none';
      errorBox.offsetHeight; // reflow
      errorBox.style.animation = 'shake 0.4s ease-in-out';
    }
  </script>
</body>
</html>
